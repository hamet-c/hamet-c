# Renders the SVGs embedded in README.md and commits them back to this repo.
#
# One-time setup:
#   1. Create a classic personal access token with NO scopes ticked:
#      https://github.com/settings/tokens -> Generate new token (classic)
#   2. Add it here as a secret named METRICS_TOKEN:
#      Settings -> Secrets and variables -> Actions -> New repository secret
#   3. Settings -> Actions -> General -> Workflow permissions -> Read and write
#   4. Run it once by hand: Actions tab -> Metrics -> Run workflow
#
# The images in README.md are broken until that first run finishes.
#
# To include private contributions in the calendar, turn on
# "Include private contributions on my profile" in your GitHub profile settings.

name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: America/New_York
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
